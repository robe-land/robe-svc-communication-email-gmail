[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robe-svc-communication-email-gmail"
version = "0.1.0"
description = "Synthetic-first email retrieval service using Google Pub/Sub"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "google-cloud-pubsub>=2.30,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "jsonschema[format]>=4.23,<5",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a running local Pub/Sub emulator and service",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/robe-svc-communication-email-gmail/contracts" = ["contracts/email-retrieval-requested.v1.schema.json"]
